  <rect class="f" x="12" y="7.6" width="3" height="5" rx="1.3"/>
  <!-- Forma d'onda -->
  <rect class="f" x="5" y="8" width="1" height="4" rx=".5"/>
  <rect class="f" x="7" y="6" width="2" height="7" rx="1"/>
  <rect class="f" x="10" y="8" width="1" height="4" rx=".5"/>
  <!-- Libro aperto -->
  <path class="s" d="M2.4 14.6 Q5.4 12.9 8 14.9 Q10.6 12.9 13.6 14.6" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
