<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <title>Leggio</title>
  <!-- Icona per la scheda del browser: il disegno di icona.svg semplificato e in un solo colore,
       pensato per 16 px. Scuro su temi chiari, crema su temi scuri. -->
  <style>
    .f { fill: #14121c; } .s { stroke: #14121c; }
    @media (prefers-color-scheme: dark) { .f { fill: #fef7e9; } .s { stroke: #fef7e9; } }
  </style>
  <!-- Archetto -->
  <path class="s" d="M2.3 8.2 A5.7 5.9 0 0 1 13.7 8.2" fill="none" stroke-width="1.6"/>
  <!-- Padiglioni -->
